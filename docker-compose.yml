name: kafka-example

networks:
  proxy_network:
  database_network:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    networks:
      - database_network
      - proxy_network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka-broker-1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-broker-1
    ports:
      - "19092:19092"
    depends_on:
      - zookeeper
    networks:
      - database_network
      - proxy_network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # bind listeners (was missing -> broker never listened on 19092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:19092
      # PLAINTEXT (kafka-broker-1:9092) = in-network clients; PLAINTEXT_INTERNAL (localhost:19092) = host clients
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9092,PLAINTEXT_INTERNAL://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    depends_on:
      - kafka-broker-1
    networks:
      - database_network
      - proxy_network
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: 'zookeeper:2181'
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-broker-1:9092
      SCHEMA_REGISTRY_DEBUG: 'true'

  kowl:
    image: quay.io/cloudhut/kowl:latest
    hostname: kowl
    container_name: kowl
    restart: unless-stopped  # broker may not be ready on first boot; kowl exits, so let it retry
    depends_on:
      - kafka-broker-1
    networks:
      - proxy_network
      - database_network
    ports:
      - "9080:8080"
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      KAFKA_ZOOKEEPER: zookeeper:2181

  producer:
    # image used by `up` directly. Build it once (bake-free) with:
    #   docker build -t kafka-producer:local https://github.com/mateusvpassos/kafka-producer.git#origin
    image: kafka-producer:local
    build:
      context: https://github.com/mateusvpassos/kafka-producer.git#origin
    container_name: kafka-producer
    depends_on:
      - kafka-broker-1
    networks:
      - database_network
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092
      KAFKA_TOPIC: topic_test

  consumer:
    # image used by `up` directly. Build it once (bake-free) with:
    #   docker build -t kafka-consumer:local https://github.com/mateusvpassos/kafka-consumer.git#origin
    image: kafka-consumer:local
    build:
      context: https://github.com/mateusvpassos/kafka-consumer.git#origin
    container_name: kafka-consumer
    depends_on:
      - kafka-broker-1
    networks:
      - database_network
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092
      KAFKA_TOPIC: topic_test
